<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Berjalan sebelum paint supaya tidak ada kedipan tema/bahasa.
			(function () {
				var root = document.documentElement;
				root.classList.add('js');

				try {
					var stored = localStorage.getItem('oots-theme');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var dark = stored === 'dark' || (stored !== 'light' && prefersDark);
					root.classList.toggle('dark', dark);

					var params = new URLSearchParams(window.location.search);
					var lang = params.get('lang');
					var storedLang = localStorage.getItem('oots-locale');
					var locale = lang === 'en' || lang === 'id' ? lang : storedLang;
					if (locale === 'en' || locale === 'id') root.lang = locale;
				} catch (error) {
					// localStorage bisa diblokir; biarkan default.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
